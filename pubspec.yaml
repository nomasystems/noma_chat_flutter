name: noma_chat
description: >-
  Plug & play Flutter chat: SDK with REST + real-time client, offline Hive
  cache, UI adapter and ready-to-use UI components for the Nomasystems chat
  backend.
version: 0.29.1

homepage: https://github.com/nomasystems/noma_chat_flutter
repository: https://github.com/nomasystems/noma_chat_flutter
issue_tracker: https://github.com/nomasystems/noma_chat_flutter/issues
documentation: https://pub.dev/documentation/noma_chat/latest/

topics:
  - chat
  - messaging
  - realtime
  - websocket
  - ui-kit

screenshots:
  - description: 'Real-time chat between two users with reactions'
    path: screenshots/realtime_demo.gif
  - description: 'Room list with unread badges and presence indicators'
    path: screenshots/room_list.png
  - description: 'Chat view with message bubbles, reactions and mentions'
    path: screenshots/chat_view.png
  - description: 'Voice recorder with lock gesture'
    path: screenshots/voice_recorder.png
  - description: 'Group info management and member list'
    path: screenshots/group_info.png

platforms:
  android:
  ios:
  macos:
  linux:
  windows:
  web:

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  web_socket_channel: ^3.0.0
  freezed_annotation: ^3.0.0
  hive_ce: ^2.19.0
  cached_network_image: ^3.4.1
  emoji_picker_flutter: ^4.3.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.5
  record: ^7.0.0
  url_launcher: ^6.3.1
  # Default "open file/PDF attachment" handler. Opens a downloaded file by its
  # on-disk extension via the OS viewer, independent of the HTTP Content-Type
  # the server returns. Maintained fork of `open_file`.
  open_filex: ^4.7.0
  html: ^0.15.5
  image_picker: ^1.1.0
  # Backs the SDK's own full-screen capture screen (`CameraCapturePage`):
  # tap the shutter for a still, hold it for a clip. `image_picker` cannot
  # do that — its camera source is decided before the viewfinder opens and
  # returns one or the other. Federated for android / ios / web only; the
  # `platforms:` block above stays at six because a plugin without an
  # implementation for a target does not strip this package's platform
  # tags (`open_filex` is android/ios-only and already precedent). Desktop
  # and web keep the `image_picker` route —
  # `PlatformSupport.supportsInAppCameraCapture` decides.
  camera: ^0.12.0
  # Camera + microphone runtime permissions for that screen: the capture
  # flow has to tell "denied" from "permanently denied" so it can offer an
  # `openAppSettings()` way out instead of a dead end, which the plugins'
  # own boolean failures cannot express.
  permission_handler: '>=11.0.0 <13.0.0'
  # Bumped to >=9.0.0 because v9 removed `FilePicker.platform.pickFiles`
  # in favour of the static `FilePicker.pickFiles`. Loose upper bound so
  # consumers (e.g. WB/mobile already on ^11) don't hit version-solving
  # conflicts. The narrow surface we use (`FilePicker.pickFiles` with
  # `type`, `allowedExtensions`, `withData`) is stable across 9.x → 11.x.
  file_picker: '>=11.0.0 <12.0.0'
  # Capped below 12.x on purpose. Under Swift Package Manager (the Flutter
  # 3.44 default), file_picker pulls DKImagePickerController whose SPM
  # manifest pins `TOCropViewController` to >=2.6.0 <3.0.0, while
  # image_cropper 12.x jumped to `TOCropViewController` ~>3.1.2 — the two are
  # mutually exclusive and break the iOS build in any consumer that uses SPM
  # (e.g. WB/mobile). image_cropper 11.x stays on TOCropViewController 2.8.x,
  # which co-resolves cleanly, and exposes the identical Dart API (both 11 and
  # 12 depend on image_cropper_platform_interface ^8.0.0 — cropImage /
  # AndroidUiSettings / IOSUiSettings / CropStyle / CropAspectRatioPreset are
  # unchanged). Do NOT bump to ^12 until file_picker's DKImagePickerController
  # moves to TOCropViewController 3.x; otherwise consumers need an
  # SPM-disabling workaround in their own pubspec, which defeats plug & play.
  image_cropper: ^11.0.0
  # Extracts the poster frame `VideoBubble` paints, behind the
  # `VideoThumbnailer` seam so a later swap is a one-file change. The
  # original `video_thumbnail` is not an option: every one of its published
  # versions (up to 0.5.6) constrains `sdk: <3.0.0`, which cannot co-resolve
  # with this package's `^3.12.0`. This maintained fork is on `sdk: ^3.4.0`
  # and keeps the same native extractors (MediaMetadataRetriever / AVAsset)
  # — same relationship `open_filex` has with `open_file` above. It also
  # declares web, which buys us nothing: it generates from a file path or a
  # URL, and on web there is no path while every attachment URL needs a
  # Bearer token. `PlatformSupport.supportsVideoThumbnails` gates it to
  # mobile accordingly.
  get_thumbnail_video: ^0.7.3
  # Backs `ImageMetadataScrubber`, which rebuilds every picked photo from its
  # pixels so nothing the source container carried can travel with it. Pure
  # Dart, which is the point: a native compressor (`flutter_image_compress`)
  # would be faster but ships android / ios / web only, narrowing what this
  # package can promise on the six targets in `platforms:` above, and could
  # not be exercised under `flutter test` at all. `dart:ui` was the other
  # candidate and cannot do the job: it decodes, but has no JPEG encoder, and
  # its decode is the platform's — EXIF orientation and colour management
  # would then differ between a browser and Skia, which is exactly the kind of
  # per-platform difference this pass must not have. The cost is speed: a
  # 12 MP photo takes a few hundred milliseconds to decode and re-encode, so
  # the work goes to a background isolate (see
  # `PlatformSupport.supportsBackgroundIsolates`).
  image: ^4.5.0
  # Plays the clip back inside `CameraCaptureReview`, the confirmation step
  # between the shutter and the send. `get_thumbnail_video` above only
  # extracts a still, and a poster frame is not a review: the user has to be
  # able to watch what they just recorded before it leaves the device.
  # Federated for android / ios / macos / web, so the `platforms:` block
  # above is unaffected for the same reason `camera` states — and desktop
  # never reaches this screen anyway
  # (`PlatformSupport.supportsInAppCameraCapture`). Hosts that would rather
  # not ship a second video stack can swap the preview out through
  # `CameraCapturePage(videoPreviewBuilder: …)`.
  video_player: ^2.9.2
  characters: ^1.4.0
  shared_preferences: ^2.2.0
  uuid: ^4.0.0
  intl: ^0.20.2
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  fake_async: ^1.3.0
  build_runner: ^2.4.0
  freezed: ^3.1.0
  alchemist: ^0.12.0
  # Declared explicitly (rather than leaned on transitively through
  # `camera`) so the camera-capture tests can swap `CameraPlatform.instance`
  # for a fake without a `depend_on_referenced_packages` ignore.
  camera_platform_interface: ^2.12.0
  # Same reason, for `VideoPlayerPlatform.instance`: the capture-review tests
  # drive playback against a fake player instead of a decoder that does not
  # exist under `flutter test`.
  video_player_platform_interface: ^6.2.0
